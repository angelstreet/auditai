# docker-compose.yml \u2014 single-host stack for demo + pilot use.
#
# Brings up:
#   * db      \u2014 PostgreSQL 17 (the same major as M4 / M7).
#   * migrate \u2014 runs once, applies all infra/db/migrations/*.sql +
#                       the synthetic seed in 0003. The container exits
#                       after a successful run; `web` waits for it.
#   * web     \u2014 the production Next.js server (built by Dockerfile).
#
# Run:
#   POSTGRES_PASSWORD=<strong secret> DATABASE_APP_PASSWORD=<strong secret> \
#   docker compose up --build
#
# Both passwords are required (no defaults): compose refuses to start without them.
#
# Tear down:
#   docker compose down -v   (the -v wipes the embedded pgdata volume)
#
# The local one-command runner (ADR 0006) still ships `pnpm local:up` and
# is the recommended developer path; this file exists for self-host
# pilots.

version: '3.9'

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: auditai
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auditai -d auditai']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
    image: auditai-web:latest
    command: ['node', 'infra/db/scripts/migrate.mjs']
    environment:
      DATABASE_URL: postgres://auditai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/auditai
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    image: auditai-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://auditai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/auditai
      NODE_ENV: production
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?set DATABASE_APP_PASSWORD}
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'

  # Retention worker (FR-09). One pass per container start; compose has no
  # scheduler, so run it from the host with `docker compose run --rm retention`
  # on a systemd timer or cron (see docs/ops/retention-schedule.md), or use the
  # loop mode below.
  retention:
    image: auditai-web:latest
    command: ['node', '--import', 'tsx', 'services/ai/scripts/retention-run.ts']
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://auditai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/auditai
      RETENTION_INTERVAL_SECONDS: '86400'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
